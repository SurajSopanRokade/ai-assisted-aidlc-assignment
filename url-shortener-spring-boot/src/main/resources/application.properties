# ---------------------------------------------------------------------------
# Default profile: local development.
# Production overrides live in application-prod.properties; tests use
# application-test.properties. Nothing here should be environment-specific.
# ---------------------------------------------------------------------------

# The public origin used to build short_url in POST /shorten responses.
# This is deliberately NOT derived from the inbound Host header: a client can
# set any Host it likes, which would let an attacker mint links pointing at a
# domain they control. Override per environment via APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Fixed-window rate limit on the write endpoint (POST /shorten).
# In-memory and therefore per-instance; see SECURITY note in RateLimitFilter.
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=60

# --- Datasource -------------------------------------------------------------
# journal_mode=WAL      readers no longer block the writer, which matters because
#                       every redirect performs a write (click tracking).
# busy_timeout=5000     wait up to 5s for the write lock instead of failing
#                       immediately with SQLITE_BUSY.
spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:url_shortener.db}?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite permits exactly one writer. A pool larger than 1 does not increase
# write throughput, it just converts waiting into SQLITE_BUSY failures, so
# contention is resolved in the pool (fair queueing) rather than in the driver.
# This ceiling is a SQLite property, not an application design limit: on
# PostgreSQL this line is deleted and the pool sizes normally.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Keep the persistence context inside the service layer; without this, lazy
# collections can be initialised during response rendering, outside any
# transaction we control.
spring.jpa.open-in-view=false

server.port=8080
# Never surface stack traces or internal messages through Spring's default
# error representation. GlobalExceptionHandler owns the client-facing contract.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- OpenAPI ----------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Observability ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=url-shortener

# Actuator is served by its own handler mapping and does not inherit the CORS
# rules registered in WebConfig, so the frontend origin has to be whitelisted
# separately for /actuator/** to be readable.
management.endpoints.web.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}
management.endpoints.web.cors.allowed-methods=GET

# --- CORS -------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}

# --- Logging ----------------------------------------------------------------
# %X{requestId} is populated by RequestIdFilter so a single request can be
# traced across every line it produced.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.copilot.urlshortener=DEBUG
