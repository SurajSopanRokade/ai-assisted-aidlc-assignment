spring.datasource.url=jdbc:sqlite:url_shortener.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# Actuator Endpoints
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Actuator is served by its own handler mapping and does not inherit the CORS
# rules registered in UrlShortenerApplication#corsConfigurer, so the frontend
# origin has to be whitelisted separately for /actuator/** to be readable.
management.endpoints.web.cors.allowed-origins=http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET

# Logging
logging.level.root=INFO
logging.level.com.copilot.urlshortener=DEBUG
