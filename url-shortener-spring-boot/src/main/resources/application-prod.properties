# ---------------------------------------------------------------------------
# Production profile (activated by SPRING_PROFILES_ACTIVE=prod).
#
# Must exist for every profile name any deployment activates: Spring does not
# warn when an activated profile has no property file, it just silently runs
# with development defaults.
# ---------------------------------------------------------------------------

# Written to the mounted volume so data survives container replacement.
# Must stay in sync with the volume mount in docker-compose.yml.
spring.datasource.url=jdbc:sqlite:${APP_DB_PATH:/app/data/url_shortener.db}?journal_mode=WAL&busy_timeout=5000

# Schema changes must be reviewed and applied deliberately, never inferred from
# entity classes at boot. `validate` fails fast on drift instead of silently
# mutating a production schema.
#
# KNOWN GAP: there is no migration tool wired up yet (see LIMITATIONS.md).
# Until Flyway is added, the schema must be created by running once with
# APP_DDL_AUTO=update, then redeploying with the default `validate`.
spring.jpa.hibernate.ddl-auto=${APP_DDL_AUTO:validate}

# Health details can expose infrastructure topology to unauthenticated callers.
management.endpoint.health.show-details=never

logging.level.root=WARN
logging.level.com.copilot.urlshortener=INFO

# Swagger UI is a development affordance; the raw contract stays available for
# API consumers and contract tests.
springdoc.swagger-ui.enabled=false
