# ---------------------------------------------------------------------------
# Test profile. Activated for every surefire run via the maven-surefire-plugin
# configuration in pom.xml, so `mvn test` can never touch a developer's local
# url_shortener.db. This is pinned in the build rather than left to an
# annotation because the integration tests call deleteAll(): if the profile is
# ever missed, they truncate whatever database happens to be configured.
#
# The engine stays SQLite rather than switching to H2: the concurrency
# behaviour under test (WAL mode, single-writer locking) is SQLite-specific and
# would not be exercised by a different database.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:sqlite:target/test-url-shortener.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=1

# Schema is rebuilt for every test context, so tests never inherit state from a
# previous run.
spring.jpa.hibernate.ddl-auto=create-drop

app.base-url=http://short.test
app.rate-limit.enabled=false

logging.level.root=WARN
logging.level.com.copilot.urlshortener=WARN
