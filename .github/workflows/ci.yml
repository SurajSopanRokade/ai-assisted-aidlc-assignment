name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: url-shortener-spring-boot

jobs:
  backend:
    name: Backend — build, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # `verify` rather than `test`: it runs the JaCoCo coverage gate, which is
      # the difference between measuring coverage and enforcing it.
      - name: Build, test and enforce coverage
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: url-shortener-spring-boot/target/site/jacoco/

      # Surefire output is what makes a red build diagnosable without a rerun.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: url-shortener-spring-boot/target/surefire-reports/

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: url-shortener-spring-boot/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: url-shortener-spring-boot/frontend/package-lock.json

      # `ci` not `install`: fails on a lockfile mismatch instead of silently
      # resolving different versions than a developer has locally.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so this is the typecheck too.
      - name: Typecheck and build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      # The image is not pushed; this proves the Dockerfile still builds, which
      # is otherwise only discovered at deploy time.
      - name: Build image
        run: docker build -t url-shortener:ci .
